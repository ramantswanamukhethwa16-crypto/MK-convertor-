<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MK Converter</title>
    <style>
        body { background:#000; color:#fff; font-family:Arial, sans-serif; text-align:center; padding:20px; }
        .box { border:2px solid #00ff88; border-radius:12px; padding:20px; max-width:400px; margin:20px auto; }
        input, button { width:100%; padding:12px; margin-top:10px; border-radius:8px; border:none; box-sizing:border-box; }
        input { background:#1a1a1a; color:#fff; }
        button { background:#00ff88; font-weight:bold; cursor:pointer; }
        #result, #filePage { display:none; }
    </style>
</head>
<body>

    <div id="authPage">
        <h2>Admin Access</h2>
        <div class="box">
            <input type="password" id="p" placeholder="Enter Password">
            <button onclick="login()">Login</button>
        </div>
    </div>

    <div id="converterPage" style="display:none;">
        <h2>Mediafire Link Converter</h2>
        <div class="box">
            <input type="text" id="link" placeholder="Paste Mediafire Link">
            <button onclick="convert()">Generate Link</button>
            <div id="result"></div>
        </div>
    </div>

    <div id="filePage">
        <h2 style="color:#00ff88">Your File Is Ready</h2>
        <h1 id="count" style="font-size:50px;">5</h1>
        <button id="goBtn" style="display:none;" onclick="openFile()">Download File</button>
        <p id="adText">Loading ads...</p>
    </div>

<script>
let targetFile = "";
function login(){
    if(document.getElementById('p').value === "0734548144"){
        document.getElementById('authPage').style.display='none';
        document.getElementById('converterPage').style.display='block';
    } else { alert('Wrong password'); }
}
function convert(){
    let l = document.getElementById('link').value;
    if(!l.includes('mediafire.com')){ alert('Invalid link'); return; }
    let enc = btoa(l);
    let mLink = window.location.origin + window.location.pathname + '?file=' + enc;
    let res = document.getElementById('result');
    res.style.display='block';
    res.innerHTML = '<br><a href="'+mLink+'" target="_blank" style="color:#00ff88">'+mLink+'</a>';
}
window.onload = function(){
    let params = new URLSearchParams(window.location.search);
    if(params.has('file')){
        try{
            targetFile = atob(params.get('file'));
            document.getElementById('authPage').style.display='none';
            document.getElementById('converterPage').style.display='none';
            document.getElementById('filePage').style.display='block';
            
            let s1 = document.createElement('script');
            s1.src = "https://5gvci.com/act/files/tag.min.js?z=11793384";
            s1.async = true;
            document.body.appendChild(s1);

            let s2 = document.createElement('script');
            s2.dataset.zone = '11793385';
            s2.src = 'https://n6wxm.com/vignette.min.js';
            document.body.appendChild(s2);

            let c = 5;
            let t = setInterval(()=>{
                c--;
                document.getElementById('count').innerText = c;
                if(c <= 0){
                    clearInterval(t);
                    document.getElementById('count').style.display='none';
                    document.getElementById('goBtn').style.display='block';
                    document.getElementById('adText').style.display='none';
                }
            }, 1000);
        }catch(e){}
    }
}
function openFile(){ window.location.href = targetFile; }
</script>
</body>
</html>
